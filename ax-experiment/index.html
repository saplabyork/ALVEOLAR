<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening experiment</title>
  <link rel="stylesheet" href="lib/jspsych.css">
  <style>
    body { background: #ffffff; color: #222; font-family: Arial, Helvetica, sans-serif; }
    .text { max-width: 700px; margin: 0 auto; text-align: left; line-height: 1.6; font-size: 18px; }
    .text h2 { text-align: center; }
    .fixation { font-size: 60px; font-weight: bold; }
    .keys { display: flex; justify-content: center; gap: 80px; margin: 30px 0; font-size: 20px; text-align: center; }
    .keybox { min-width: 140px; }
    .key { display: inline-block; border: 2px solid #444; border-radius: 6px; padding: 6px 16px; font-weight: bold; font-size: 24px; margin-bottom: 6px; }
    .fb { font-size: 30px; font-weight: bold; }
    .fb.good { color: #1a7f37; }
    .fb.bad { color: #c62828; }
    .fb.slow { color: #8a5a00; font-size: 24px; }
    .form { max-width: 600px; margin: 0 auto; text-align: left; }
    .form label { display: block; margin: 14px 0; font-size: 16px; }
    .form input, .form select, .form textarea { font-size: 16px; padding: 4px; width: 100%; box-sizing: border-box; margin-top: 4px; }
  </style>
  <script src="lib/jspsych.js"></script>
  <script src="lib/plugin-preload.js"></script>
  <script src="lib/plugin-call-function.js"></script>
  <script src="lib/plugin-html-keyboard-response.js"></script>
  <script src="lib/plugin-html-button-response.js"></script>
  <script src="lib/plugin-survey-html-form.js"></script>
  <script src="lib/plugin-instructions.js"></script>
  <script src="lib/plugin-audio-keyboard-response.js"></script>
</head>
<body>
  <script src="config.js"></script>
  <script src="trials.js"></script>
  <script src="experiment.js"></script>
</body>
</html>
